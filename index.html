<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Suika Clone</title>
    <link rel="stylesheet" href="src/style.css" />
  </head>
  <body>
    <!-- Ranking button (top-right) -->
    <button id="ranking-btn">🏆</button>

    <!-- Ranking modal overlay -->
    <div id="ranking-modal">
      <div id="ranking-content">
        <h2 id="ranking-title">ランキング TOP 5</h2>
        <ol id="ranking-list"></ol>
        <button id="ranking-close">戻る</button>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.min.js" integrity="sha384-p8ty80jSFxlN0Y9ZlHjOYGzfXmOSD9FkIOdP+Yc3XeiDUfkSmkd7H2bQBvZrt7AC" crossorigin="anonymous"></script>
    <!-- Firebase SDK v10 (CDN / ESM) -->
    <script type="module">
      import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
      import {
        getFirestore,
        collection,
        addDoc,
        serverTimestamp,
        getDocs,
        query,
        orderBy,
        limit,
      } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

      const firebaseConfig = {
        apiKey: "AIzaSyDYW4OdLesey0JOkqD4BUxseXZbs115oQQ",
        authDomain: "zirai-suika.firebaseapp.com",
        projectId: "zirai-suika",
        storageBucket: "zirai-suika.firebasestorage.app",
        messagingSenderId: "601134771",
        appId: "1:601134771:web:33ae660a4e1433b23202c6",
      };

      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);

      /**
       * ゲーム終了時にスコアを Firestore の rankings コレクションへ保存します。
       * @param {string} playerName - プレイヤー名
       * @param {number} score      - 最終スコア
       */
      window.saveScoreToFirebase = async function (playerName, score) {
        try {
          await addDoc(collection(db, 'rankings'), {
            name: playerName,
            score: score,
            createdAt: serverTimestamp(),
          });
          console.log('スコアを保存しました:', playerName, score);
        } catch (e) {
          console.error('スコアの保存に失敗しました:', e);
        }
      };

      const rankingModal = document.getElementById('ranking-modal');

      function closeRankingModal() {
        rankingModal.style.display = 'none';
      }

      /**
       * Firestore から上位 5 件のランキングを取得してモーダルで表示します。
       */
      window.showRanking = async function () {
        const list  = document.getElementById('ranking-list');
        const title = document.getElementById('ranking-title');

        list.innerHTML = '<li style="color:#aaaaff">読み込み中...</li>';
        title.textContent = 'ランキング TOP 5';
        rankingModal.style.display = 'flex';

        try {
          const q = query(
            collection(db, 'rankings'),
            orderBy('score', 'desc'),
            limit(5)
          );
          const snapshot = await getDocs(q);
          list.innerHTML = '';
          if (snapshot.empty) {
            const li = document.createElement('li');
            li.style.color = '#aaaaff';
            li.textContent = 'まだランキングデータがありません';
            list.appendChild(li);
          } else {
            snapshot.docs.forEach((doc) => {
              const d = doc.data();
              const li   = document.createElement('li');
              const name  = document.createElement('span');
              const score = document.createElement('span');
              name.className  = 'rank-name';
              score.className = 'rank-score';
              name.textContent  = d.name;
              score.textContent = `${d.score}点`;
              li.appendChild(name);
              li.appendChild(score);
              list.appendChild(li);
            });
          }
        } catch (e) {
          console.error('ランキングの取得に失敗しました:', e);
          list.innerHTML = '<li style="color:#ff6666">取得に失敗しました</li>';
        }
      };

      // ランキングボタン・閉じるボタンのイベント設定
      document.getElementById('ranking-btn').addEventListener('click', window.showRanking);
      document.getElementById('ranking-close').addEventListener('click', closeRankingModal);
      rankingModal.addEventListener('click', (e) => {
        if (e.target === rankingModal) closeRankingModal();
      });
    </script>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
